<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حلقتي - إدارة حلقات القرآن الكريم</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#047857">
    <link rel="icon" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <!-- تم تثبيت أرقام الإصدارات هنا لمنع الأعطال المستقبلية -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@0.292.0"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        /* ترتيب خطوط احتياطي: إذا تعذّر تحميل Tajawal (لا يوجد إنترنت، كما يحصل داخل تطبيق مُغلّف offline)
           فإن Noto Sans Arabic مثبّت ضمن نظام أندرويد نفسه افتراضياً، فتبقى الواجهة عربية واضحة
           بدل أن ترتد لخط افتراضي عام لا علاقة له بهوية التطبيق */
        body { font-family: 'Tajawal', 'Noto Sans Arabic', 'Noto Kufi Arabic', 'Segoe UI', Tahoma, Arial, sans-serif; background-color: #f8fafc; }
        .tab-active { border-bottom: 3px solid #059669; color: #059669; font-weight: 900; }
        @media print {
            @page { size: A4; margin: 12mm; }
            .no-print { display: none !important; }
            body { background: #fff !important; }
            .max-w-md { max-width: 100% !important; }
            main { padding: 0 !important; margin: 0 !important; }
            .print-area { box-shadow: none !important; border: 1px solid #d1d5db !important; max-width: 186mm !important; margin: 0 auto !important; }
            tr, .stat-box { break-inside: avoid; }
            thead { display: table-header-group; }
        }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        /* مسرح التصدير: يُركَّب فقط لحظة إنشاء الصورة/PDF ثم يُزال بالكامل، ولا يُعرض أبداً للمستخدم ولا في الطباعة */
        .export-stage { position: fixed; top: 0; left: -10000px; z-index: -1; pointer-events: none; }
        @media print { .export-stage { display: none !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icon = ({ name, size = 20, className = "" }) => {
            return <i data-lucide={name} style={{ width: size, height: size }} className={`inline-block ${className}`}></i>;
        };

        const STORAGE_KEY = 'halaqati_app_data_v2';

        // بطاقة مؤشر (KPI): عنوان واضح + قيمة بارزة + وصف مختصر، لكل معلومة مساحتها الخاصة
        const KPI_ACCENTS = {
            emerald: { bar: 'border-emerald-500', chip: 'bg-emerald-50 text-emerald-600', value: 'text-emerald-700' },
            blue:    { bar: 'border-blue-500',    chip: 'bg-blue-50 text-blue-600',       value: 'text-blue-700' },
            amber:   { bar: 'border-amber-500',   chip: 'bg-amber-50 text-amber-600',     value: 'text-amber-600' },
        };
        const KpiCard = ({ label, value, hint, icon, accent = 'emerald' }) => {
            const a = KPI_ACCENTS[accent];
            return (
                <div className={`bg-white rounded-3xl card-shadow border-b-4 ${a.bar} p-4 min-w-0 flex flex-col gap-2`}>
                    <div className="flex items-center gap-2 min-w-0">
                        <span className={`shrink-0 w-8 h-8 rounded-xl flex items-center justify-center ${a.chip}`}>
                            <Icon name={icon} size={16} />
                        </span>
                        <p className="text-[12px] font-black text-gray-600 leading-snug">{label}</p>
                    </div>
                    <p className={`text-3xl font-black leading-none ${a.value}`}>{value}</p>
                    {hint && <p className="text-[10.5px] font-bold text-gray-400 leading-snug">{hint}</p>}
                </div>
            );
        };

        // توحيد الحروف العربية المتشابهة لتسهيل البحث بالاسم (أ/إ/آ → ا، ة → ه، ى → ي) وإزالة التشكيل
        const normalizeArabic = (str) => (str || '')
            .toLowerCase()
            .replace(/[\u064B-\u0652\u0640]/g, '')
            .replace(/[أإآ]/g, 'ا')
            .replace(/ة/g, 'ه')
            .replace(/ى/g, 'ي');

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedStudentId, setSelectedStudentId] = useState(null);
            const [students, setStudents] = useState([]);
            const [sessions, setSessions] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [settings, setSettings] = useState({
                halakaName: 'حلقة الإيمان',
                teacherName: 'الشيخ محمد',
                reportFormat: 'detailed'
            });
            const [reportMode, setReportMode] = useState('monthly'); // monthly | custom
            const currentMonthStr = new Date().toISOString().slice(0, 7);
            const [reportMonth, setReportMonth] = useState(currentMonthStr);
            const [reportFrom, setReportFrom] = useState(new Date().toISOString().slice(0, 10));
            const [reportTo, setReportTo] = useState(new Date().toISOString().slice(0, 10));
            const [exporting, setExporting] = useState(false);
            const reportRef = useRef(null);
            const studentReportRef = useRef(null);
            // قوالب مخصصة فقط لتصدير الصورة/PDF: عريضة ومؤطّرة بهوية التطبيق، منفصلة تماماً عن بطاقة الجوال الضيقة المعروضة على الشاشة
            const halakaExportRef = useRef(null);
            const studentExportRef = useRef(null);
            const [reportSection, setReportSection] = useState(null); // null | 'halaqa' | 'student'
            const [selectedReportStudentId, setSelectedReportStudentId] = useState(null);
            const [studentSearchQuery, setStudentSearchQuery] = useState('');
            const [studentKashfType, setStudentKashfType] = useState('summary'); // summary | detailed
            const [halakaReportType, setHalakaReportType] = useState('detailed'); // summary | detailed
            const [selectedSessionDate, setSelectedSessionDate] = useState(new Date().toISOString().split('T')[0]);
            const [showSessionHistory, setShowSessionHistory] = useState(false);
            const [showResetModal, setShowResetModal] = useState(false);
            const [resetConfirmText, setResetConfirmText] = useState('');
            const [showDrawer, setShowDrawer] = useState(false);
            const [exportJob, setExportJob] = useState(null); // null | { kind: 'halaka'|'student', format: 'image'|'pdf', fileTitle, shareTitle }
            const [sessionSearchQuery, setSessionSearchQuery] = useState('');

            // Load Data
            useEffect(() => {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        setStudents(parsed.students || []);
                        setSessions(parsed.sessions || []);
                        setTransactions(parsed.transactions || []);
                        setSettings(parsed.settings || settings);
                    } catch(e) {
                        console.error("Error parsing local storage", e);
                    }
                }
            }, []);

            // Save Data & Render Icons
            useEffect(() => {
                const data = { students, sessions, settings, transactions };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                if (window.lucide) window.lucide.createIcons();
            }, [students, sessions, settings, transactions, activeTab]);

            // أيقونات التقرير المفتوح: تُحوَّل إلى SVG عند فتح التقرير أو تبديل نوعه/فترته أو انتهاء التصدير
            // (كانت تبقى فارغة لأن التأثير أعلاه لا يراقب هذه الحالات)
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [reportSection, selectedReportStudentId, halakaReportType, studentKashfType, reportMode, reportMonth, reportFrom, reportTo, exporting, exportJob]);

            // Date Formatting
            const getTodayDate = () => {
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
                return new Date().toLocaleDateString('ar-EG', options);
            };

            const formatDate = (isoString) => {
                const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' };
                return new Date(isoString).toLocaleDateString('ar-EG', options);
            };

            const todayKey = new Date().toISOString().split('T')[0];

            // Dashboard Stats
            const stats = useMemo(() => {
                const todaySession = sessions.find(s => s.date === todayKey);
                return {
                    totalStudents: students.filter(s => s.active).length,
                    presentToday: todaySession ? todaySession.records.filter(r => r.status === 'present').length : 0,
                    lateToday: todaySession ? todaySession.records.filter(r => r.status === 'late').length : 0,
                    absentToday: todaySession ? todaySession.records.filter(r => r.status === 'absent' || r.status === 'absent_excused').length : 0,
                };
            }, [students, sessions, todayKey]);

            // Points Logic
            const getStudentPoints = (studentId) => {
                return transactions
                    .filter(t => t.studentId === studentId)
                    .reduce((sum, t) => sum + t.pointsChange, 0);
            };

            const getStudentPointsForDate = (studentId, dateStr) => {
                return transactions
                    .filter(t => t.studentId === studentId && t.date.startsWith(dateStr))
                    .reduce((sum, t) => sum + t.pointsChange, 0);
            };

            const getStudentTodayPoints = (studentId) => getStudentPointsForDate(studentId, todayKey);

            const getStudentStars = (points) => {
                return points > 0 ? Math.floor(points / 10) : 0;
            };

            const addPointsTransaction = (studentId, pointsChange, type, note = '') => {
                const newTransaction = {
                    id: Date.now().toString(),
                    studentId,
                    pointsChange,
                    type,
                    note,
                    date: new Date().toISOString()
                };
                setTransactions(prev => [newTransaction, ...prev]);
            };

            // Handlers
            const addStudent = (e) => {
                e.preventDefault();
                const name = e.target.studentName.value;
                if (!name) return;
                const newStudent = {
                    id: Date.now().toString(),
                    name,
                    phone: e.target.parentPhone.value,
                    active: true,
                    joinDate: new Date().toISOString()
                };
                setStudents([...students, newStudent]);
                e.target.reset();
            };

            const toggleStudentStatus = (id) => {
                setStudents(students.map(s => s.id === id ? {...s, active: !s.active} : s));
            };

            const deleteStudent = (id) => {
                if(confirm("هل أنت متأكد من حذف هذا الطالب نهائياً؟")) {
                    setStudents(students.filter(s => s.id !== id));
                    setTransactions(transactions.filter(t => t.studentId !== id));
                }
            };

            const saveSessionRecord = (studentId, field, value, dateStr = selectedSessionDate) => {
                setSessions(prev => {
                    const sessionIndex = prev.findIndex(s => s.date === dateStr);
                    let newSessions = [...prev];
                    
                    if (sessionIndex === -1) {
                        newSessions.push({
                            date: dateStr,
                            records: [{ studentId, [field]: value }]
                        });
                    } else {
                        const recordIndex = newSessions[sessionIndex].records.findIndex(r => r.studentId === studentId);
                        if (recordIndex === -1) {
                            newSessions[sessionIndex].records.push({ studentId, [field]: value });
                        } else {
                            newSessions[sessionIndex].records[recordIndex][field] = value;
                        }
                    }
                    return newSessions;
                });
            };

            const getRecord = (studentId, dateStr = selectedSessionDate) => {
                const session = sessions.find(s => s.date === dateStr);
                return session?.records.find(r => r.studentId === studentId) || {
                    status: 'none',
                    hifzPages: '', hifzNote: '', hifzPassed: '',
                    reviewPages: '', reviewNote: '', reviewPassed: '',
                    rating: 'جيد'
                };
            };

            // حذف تسجيل يوم كامل نهائياً (يستخدم من صفحة السجل أو من داخل شاشة الجلسة)
            const deleteSessionDay = (dateStr) => {
                setSessions(prev => prev.filter(s => s.date !== dateStr));
            };

            const confirmDeleteDay = (dateStr) => {
                if (confirm(`سيتم حذف كل تسجيلات يوم ${formatDisplayDateShort(dateStr)} نهائياً (الحضور، الحفظ، المراجعة) ولا يمكن التراجع. هل أنت متأكد؟`)) {
                    deleteSessionDay(dateStr);
                    if (selectedSessionDate === dateStr) setSelectedSessionDate(todayKey);
                }
            };

            // مسح تسجيل طالب واحد ضمن يوم معيّن (بدون التأثير على بقية الطلاب أو الأيام الأخرى)
            const clearStudentRecordForDate = (studentId, dateStr) => {
                setSessions(prev => prev.map(s => {
                    if (s.date !== dateStr) return s;
                    return { ...s, records: s.records.filter(r => r.studentId !== studentId) };
                }));
            };

            // كل الأيام القابلة للتصفح: كل يوم فيه تسجيلات + اليوم الحالي دائماً
            const browsableDates = useMemo(() => {
                const set = new Set(sessions.map(s => s.date));
                set.add(todayKey);
                return Array.from(set).sort((a, b) => a.localeCompare(b));
            }, [sessions, todayKey]);

            const sessionDatesSorted = useMemo(() => {
                return [...sessions].map(s => s.date).sort((a, b) => b.localeCompare(a));
            }, [sessions]);

            const currentDateIndex = browsableDates.indexOf(selectedSessionDate);
            const canGoPrevDate = currentDateIndex > 0;
            const canGoNextDate = currentDateIndex !== -1 && currentDateIndex < browsableDates.length - 1;
            const goPrevDate = () => { if (canGoPrevDate) setSelectedSessionDate(browsableDates[currentDateIndex - 1]); };
            const goNextDate = () => { if (canGoNextDate) setSelectedSessionDate(browsableDates[currentDateIndex + 1]); };

            // نتيجة بحث الجلسات: نص البحث بعد إزالة المسافات الزائدة وتوحيد الحروف، ويعمل مع أي جزء من الاسم
            const sessionQueryNorm = normalizeArabic(sessionSearchQuery.trim());
            const sessionStudents = students.filter(s => s.active && (!sessionQueryNorm || normalizeArabic(s.name).includes(sessionQueryNorm)));

            const formatDisplayDateShort = (dateStr) => {
                const d = new Date(dateStr + 'T00:00:00');
                return d.toLocaleDateString('ar-EG', { weekday: 'short', day: 'numeric', month: 'short' });
            };

            // تحويل بيانات الحفظ/المراجعة إلى نص جاهز للنسخ بصيغة: عدد الصفحات، الملاحظة، ✓/✗
            const formatFieldLine = (pages, note, passed) => {
                const parts = [];
                if (pages !== '' && pages !== undefined && pages !== null) parts.push(`${pages}صفحة`);
                if (note) parts.push(note);
                if (passed === 'yes') parts.push('✓');
                else if (passed === 'no') parts.push('إعادة ✗');
                return parts.join('، ');
            };

            const copySessionReport = (dateStr) => {
                const session = sessions.find(s => s.date === dateStr);
                if (!session) return alert("لا توجد بيانات مسجلة لهذا اليوم");

                const isToday = dateStr === todayKey;
                let presentCount = 0, lateCount = 0, absentCount = 0;

                let report = `━━━━━━━━━━━━━━\n`;
                report += `📖 تقرير حلقة (${settings.halakaName})\n`;
                report += `📅 ${isToday ? getTodayDate() : formatDisplayDateShort(dateStr)}\n`;
                report += `━━━━━━━━━━━━━━\n`;

                students.filter(s => s.active).forEach((s, index) => {
                    const r = session.records.find(rec => rec.studentId === s.id) || { status: 'absent' };
                    const dayPoints = getStudentPointsForDate(s.id, dateStr);
                    if (r.status === 'present') presentCount++;
                    else if (r.status === 'late') lateCount++;
                    else absentCount++;

                    report += `${index + 1}️⃣ ${s.name}\n`;
                    if (r.status === 'present' || r.status === 'late') {
                        report += r.status === 'late' ? `🕒 متأخر\n` : `✔ حاضر\n`;
                        const hifzLine = formatFieldLine(r.hifzPages, r.hifzNote, r.hifzPassed);
                        const reviewLine = formatFieldLine(r.reviewPages, r.reviewNote, r.reviewPassed);
                        if (hifzLine) report += `📌 حفظ: ${hifzLine}\n`;
                        if (reviewLine) report += `📌 مراجعة: ${reviewLine}\n`;
                        report += `⭐ تقييم: ${r.rating || 'جيد'}\n`;
                    } else if (r.status === 'absent_excused') {
                        report += `✖ غائب (بعذر)\n`;
                    } else {
                        report += `✖ غائب (غير مبرر)\n`;
                    }
                    
                    if (dayPoints > 0) {
                        report += `🎯 نقاط اليوم: +${dayPoints} نقطة\n`;
                    } else if (dayPoints < 0) {
                        report += `🔻 نقاط اليوم: ${dayPoints} نقطة\n`;
                    }

                    report += `──────────────\n`;
                });

                report += `الحضور: ${presentCount}\n`;
                report += `التأخر: ${lateCount}\n`;
                report += `الغياب: ${absentCount}\n`;
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("تم نسخ تقرير الجلسة بنجاح!");
            };

            const copyTodayReport = () => copySessionReport(todayKey);

            const copyPointsReport = () => {
                const activeStudents = students.filter(s => s.active);
                if (activeStudents.length === 0) return alert("لا يوجد طلاب لنسخ تقريرهم");

                let report = `━━━━━━━━━━━━━━\n`;
                report += `🌟 تقرير أرصدة الطلاب والنجوم\n`;
                report += `📅 ${getTodayDate()}\n`;
                report += `━━━━━━━━━━━━━━\n`;

                activeStudents.forEach((s, index) => {
                    const pts = getStudentPoints(s.id);
                    const stars = getStudentStars(pts);
                    const remainderPoints = pts > 0 ? pts % 10 : pts;

                    report += `${index + 1}️⃣ ${s.name}\n`;
                    
                    if (stars > 0) {
                        report += `الرصيد: ${stars} نجمة و ${remainderPoints} نقطة\n`;
                    } else {
                        report += `الرصيد: ${pts} نقطة\n`;
                    }
                    
                    report += `──────────────\n`;
                });
                
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("تم نسخ تقرير الأرصدة بنجاح!");
            };

            // تحديد نطاق التاريخ (من - إلى) بناءً على الوضع المختار: شهري أو فترة مخصصة
            const getReportRange = () => {
                if (reportMode === 'monthly') {
                    const [y, m] = reportMonth.split('-').map(Number);
                    const from = `${reportMonth}-01`;
                    const lastDay = new Date(y, m, 0).getDate();
                    const to = `${reportMonth}-${String(lastDay).padStart(2, '0')}`;
                    return { from, to };
                }
                return { from: reportFrom, to: reportTo };
            };

            // حساب بيانات التقرير الدوري لكل طالب: مجموع صفحات الحفظ/المراجعة (فقط ما تم تسجيله ✓) وأيام الحضور/الغياب
            const periodReportData = useMemo(() => {
                const { from, to } = getReportRange();
                const rangeSessions = sessions.filter(s => s.date >= from && s.date <= to);
                return students.filter(s => s.active).map(student => {
                    let hifzTotal = 0, reviewTotal = 0, presentCount = 0, lateCount = 0, absentCount = 0, excusedCount = 0;
                    rangeSessions.forEach(sess => {
                        const r = sess.records.find(rec => rec.studentId === student.id);
                        if (!r || !r.status || r.status === 'none') return;
                        if (r.status === 'present' || r.status === 'late') {
                            if (r.status === 'late') lateCount++; else presentCount++;
                            if (r.hifzPassed === 'yes') hifzTotal += parseFloat(r.hifzPages) || 0;
                            if (r.reviewPassed === 'yes') reviewTotal += parseFloat(r.reviewPages) || 0;
                        } else if (r.status === 'absent_excused') {
                            excusedCount++;
                        } else if (r.status === 'absent') {
                            absentCount++;
                        }
                    });
                    return { student, hifzTotal, reviewTotal, presentCount, lateCount, absentCount, excusedCount, totalDays: presentCount + lateCount + absentCount + excusedCount };
                });
            }, [students, sessions, reportMode, reportMonth, reportFrom, reportTo]);

            // إجمالي الحلقة كاملة: مجموع صفحات الحفظ والمراجعة لكل الطلاب مجتمعين خلال نفس الفترة
            const overallTotals = useMemo(() => {
                return periodReportData.reduce((acc, row) => {
                    acc.hifzTotal += row.hifzTotal;
                    acc.reviewTotal += row.reviewTotal;
                    acc.presentTotal += row.presentCount;
                    acc.lateTotal += row.lateCount;
                    acc.absentTotal += row.absentCount;
                    acc.excusedTotal += row.excusedCount;
                    return acc;
                }, { hifzTotal: 0, reviewTotal: 0, presentTotal: 0, lateTotal: 0, absentTotal: 0, excusedTotal: 0 });
            }, [periodReportData]);

            const copyPeriodReport = () => {
                const { from, to } = getReportRange();
                if (periodReportData.length === 0) return alert("لا يوجد طلاب لعرض تقريرهم");

                let report = `━━━━━━━━━━━━━━\n`;
                report += `📊 تقرير الحضور والحفظ (${settings.halakaName})\n`;
                report += `📅 من ${from} إلى ${to}\n`;
                report += `━━━━━━━━━━━━━━\n`;
                report += `🕌 إجمالي الحلقة:\n`;
                report += `عدد الطلاب: ${periodReportData.length} | حضور: ${overallTotals.presentTotal} | تأخر: ${overallTotals.lateTotal}\n`;
                report += `غياب بعذر: ${overallTotals.excusedTotal} | غياب بدون عذر: ${overallTotals.absentTotal}\n`;

                report += `━━━━━━━━━━━━━━\n`;

                if (halakaReportType === 'detailed') {
                    periodReportData.forEach((row, index) => {
                        report += `${index + 1}️⃣ ${row.student.name}\n`;
                        report += `إجمالي الأيام: ${row.totalDays} | حضور: ${row.presentCount} | تأخر: ${row.lateCount}\n`;
                        report += `غياب بعذر: ${row.excusedCount} | غياب بدون عذر: ${row.absentCount}\n`;
                        report += `📌 مجموع الحفظ: ${row.hifzTotal} صفحة\n`;
                        report += `📌 مجموع المراجعة: ${row.reviewTotal} صفحة\n`;
                        report += `──────────────\n`;
                    });
                }
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("تم نسخ التقرير بنجاح!");
            };

            

            // نتحقق ما إذا كانت الصورة الملتقطة فارغة فعلياً (كل البكسلات تقريباً بيضاء) حتى لا نسلّم للمستخدم صفحة فارغة بصمت
            const isCanvasBlank = (canvas) => {
                try {
                    const tw = 60, th = 60;
                    const tmp = document.createElement('canvas');
                    tmp.width = tw; tmp.height = th;
                    const tctx = tmp.getContext('2d');
                    tctx.drawImage(canvas, 0, 0, tw, th);
                    const data = tctx.getImageData(0, 0, tw, th).data;
                    let nonWhite = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        if (data[i] < 245 || data[i + 1] < 245 || data[i + 2] < 245) nonWhite++;
                    }
                    return nonWhite < 3;
                } catch (e) {
                    return false; // إذا تعذّر الفحص لا نفترض أنها فارغة، نكمل عادي
                }
            };

            // التقاط أي بطاقة تقرير كصورة (canvas) تمهيداً للمشاركة كصورة أو PDF
            // ملاحظة مهمة: تم إلغاء استخدام foreignObjectRendering لأنه ينتج صورة بيضاء فارغة تماماً
            // وبصمت (بدون أي خطأ) في متصفحات كثيرة عند وجود ورقة أنماط خارجية (@import) مثل خط Google Fonts هنا
            const captureElement = async (ref) => {
                if (!ref.current || !window.html2canvas) return null;
                // ننتظر تحميل الخط (Tajawal) بالكامل قبل الالتقاط لتفادي اختلاف قياسات الأسطر
                if (document.fonts && document.fonts.ready) {
                    try { await document.fonts.ready; } catch (e) {}
                }
                let canvas = await window.html2canvas(ref.current, { scale: 2, backgroundColor: '#ffffff', useCORS: true });
                // إجراء أمان إضافي: إذا خرجت الصورة فارغة لأي سبب، نحاول مرة أخرى بخيارات أبسط قبل الاستسلام
                if (!canvas || isCanvasBlank(canvas)) {
                    canvas = await window.html2canvas(ref.current, { scale: 1, backgroundColor: '#ffffff', useCORS: false, logging: false });
                }
                return canvas;
            };

            // نجمع حدود العناصر التي لا يجوز تقطيعها (كل صف جدول، وكل عنصر يحمل كلاس avoid-break)
            // نسبة إلى عنصر التقرير نفسه، لاستخدامها لاحقاً كنقاط قطع آمنة عند تقسيم الصورة الملتقطة إلى صفحات PDF
            const getSafeBreakPoints = (containerEl) => {
                if (!containerEl) return [];
                const containerTop = containerEl.getBoundingClientRect().top;
                const points = [];
                containerEl.querySelectorAll('tr, .avoid-break').forEach(el => {
                    const r = el.getBoundingClientRect();
                    points.push({ top: r.top - containerTop, bottom: r.bottom - containerTop });
                });
                return points;
            };

            // مشاركة أي عنصر كصورة مباشرة عبر قائمة المشاركة بالجهاز (واتساب ضمن الخيارات) بدون تنزيله على الجهاز
            const shareElementAsImage = async (ref, fileTitle, shareTitle) => {
                try {
                    setExporting(true);
                    const canvas = await captureElement(ref);
                    if (!canvas) { setExporting(false); return alert("تعذّر تجهيز الصورة"); }
                    if (isCanvasBlank(canvas)) { setExporting(false); return alert("تعذّر تجهيز الصورة بشكل صحيح، الرجاء المحاولة مرة أخرى."); }
                    canvas.toBlob(async (blob) => {
                        setExporting(false);
                        if (!blob) return alert("تعذّر تجهيز الصورة");
                        const file = new File([blob], `${fileTitle}.png`, { type: 'image/png' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try { await navigator.share({ files: [file], title: shareTitle, text: shareTitle }); } catch (e) {}
                        } else {
                            alert("المشاركة المباشرة غير مدعومة على هذا المتصفح، جرّبي فتح التطبيق من متصفح الجوال (كروم أو سفاري) لمشاركتها مباشرة على واتساب.");
                        }
                    }, 'image/png');
                } catch (err) {
                    console.error(err);
                    setExporting(false);
                    alert("حدث خطأ أثناء تجهيز الصورة");
                }
            };

            // مشاركة أي عنصر كملف PDF مباشرة عبر قائمة المشاركة بالجهاز، مقسّم على صفحات A4 حقيقية
            // مع تفادي تقطيع أي صف جدول أو عنصر من منتصفه بين صفحتين
            const shareElementAsPDF = async (ref, fileTitle, shareTitle) => {
                try {
                    setExporting(true);
                    const breakPoints = getSafeBreakPoints(ref.current);
                    const elementWidthPx = ref.current.getBoundingClientRect().width;
                    const canvas = await captureElement(ref);
                    if (!canvas || !window.jspdf) { setExporting(false); return alert("تعذّر تجهيز ملف PDF"); }
                    if (isCanvasBlank(canvas)) { setExporting(false); return alert("تعذّر تجهيز ملف PDF بشكل صحيح، الرجاء المحاولة مرة أخرى."); }

                    const { jsPDF } = window.jspdf;
                    const pdf = new jsPDF({ orientation: 'p', unit: 'mm', format: 'a4' });
                    const pageWidthMm = pdf.internal.pageSize.getWidth();
                    const pageHeightMm = pdf.internal.pageSize.getHeight();

                    // مقياس تحويل: كم بكسل في الصورة الملتقطة يقابل كل مليمتر بصفحة PDF
                    const pxPerMm = canvas.width / pageWidthMm;
                    const pageHeightPx = pageHeightMm * pxPerMm;
                    // نسبة تكبير الالتقاط (canvas.width أكبر من عرض العنصر الحقيقي بمقدار scale في captureElement)
                    const captureScale = canvas.width / elementWidthPx;

                    let cursorPx = 0;
                    let pageIndex = 0;

                    while (cursorPx < canvas.height - 0.5) {
                        let cutPx = Math.min(cursorPx + pageHeightPx, canvas.height);

                        // إذا كانت نقطة القطع المقترحة تمر من منتصف صف/عنصر لا يجوز تقطيعه، نرفعها لبداية ذلك العنصر
                        if (cutPx < canvas.height) {
                            breakPoints.forEach(bp => {
                                const topPx = bp.top * captureScale;
                                const bottomPx = bp.bottom * captureScale;
                                if (topPx < cutPx && bottomPx > cutPx && topPx > cursorPx) {
                                    cutPx = topPx;
                                }
                            });
                        }

                        let sliceHeightPx = cutPx - cursorPx;
                        if (sliceHeightPx <= 0) sliceHeightPx = Math.min(pageHeightPx, canvas.height - cursorPx);

                        const pageCanvas = document.createElement('canvas');
                        pageCanvas.width = canvas.width;
                        pageCanvas.height = sliceHeightPx;
                        const ctx = pageCanvas.getContext('2d');
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
                        ctx.drawImage(canvas, 0, cursorPx, canvas.width, sliceHeightPx, 0, 0, canvas.width, sliceHeightPx);

                        const pageImgData = pageCanvas.toDataURL('image/png');
                        const sliceHeightMm = sliceHeightPx / pxPerMm;
                        if (pageIndex > 0) pdf.addPage();
                        pdf.addImage(pageImgData, 'PNG', 0, 0, pageWidthMm, sliceHeightMm);

                        cursorPx += sliceHeightPx;
                        pageIndex++;
                        if (pageIndex > 40) break; // حماية من أي حلقة لا نهائية غير متوقعة
                    }

                    const blob = pdf.output('blob');
                    setExporting(false);
                    const file = new File([blob], `${fileTitle}.pdf`, { type: 'application/pdf' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try { await navigator.share({ files: [file], title: shareTitle, text: shareTitle }); } catch (e) {}
                    } else {
                        alert("مشاركة ملفات PDF غير مدعومة على هذا المتصفح، جرّبي فتح التطبيق من متصفح الجوال لمشاركته مباشرة على واتساب.");
                    }
                } catch (err) {
                    console.error(err);
                    setExporting(false);
                    alert("حدث خطأ أثناء تجهيز ملف PDF");
                }
            };

            // ===== تصدير التقارير (صورة/PDF) =====
            // قالب التصدير العريض لا يوجد في الصفحة إلا خلال عملية التصدير نفسها: نركّبه، نلتقطه، ثم نزيله.
            // بهذا لا يتجاور مع التقرير المعروض للمستخدم ولا يظهر في الطباعة.
            const startExport = (kind, format, fileTitle, shareTitle) => {
                if (exporting || exportJob) return;
                setExporting(true);
                setExportJob({ kind, format, fileTitle, shareTitle });
            };

            const exportRow = exportJob && exportJob.kind === 'student'
                ? periodReportData.find(r => r.student.id === selectedReportStudentId)

            const exportRange = getReportRange();

            useEffect(() => {
                if (!exportJob) return;
                let cancelled = false;
                (async () => {
                    // ننتظر رسم القالب المؤقت في الصفحة، ثم نحوّل أيقوناته إلى SVG قبل الالتقاط
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    if (cancelled) return;
                    if (window.lucide) window.lucide.createIcons();
                    const ref = exportJob.kind === 'halaka' ? halakaExportRef : studentExportRef;
                    try {
                        if (!ref.current) {
                            alert("تعذّر تجهيز التقرير للتصدير، الرجاء المحاولة مرة أخرى.");
                        } else if (exportJob.format === 'pdf') {
                            await shareElementAsPDF(ref, exportJob.fileTitle, exportJob.shareTitle);
                        } else {
                            await shareElementAsImage(ref, exportJob.fileTitle, exportJob.shareTitle);
                        }
                    } finally {
                        setExporting(false);
                        setExportJob(null);
                    }
                })();
                return () => { cancelled = true; };
            }, [exportJob]);

            const statusLabel = (status) => status === 'present' ? 'حاضر' : (status === 'late' ? 'متأخر' : (status === 'absent_excused' ? 'غائب بعذر' : 'غائب'));

            // سجل الأيام التفصيلي لطالب واحد ضمن الفترة المختارة، لبناء الكشف الرسمي
            const studentDayLog = useMemo(() => {
                if (!selectedReportStudentId) return [];
                const { from, to } = getReportRange();
                return sessions
                    .filter(s => s.date >= from && s.date <= to)

                        const r = sess.records.find(rec => rec.studentId === selectedReportStudentId);
                        if (!r || !r.status || r.status === 'none') return null;
                        const attended = r.status === 'present' || r.status === 'late';
                        return {
                            date: sess.date,
                            status: r.status,
                            hifzLine: attended ? (formatFieldLine(r.hifzPages, r.hifzNote, r.hifzPassed) || '—') : '—',
                            reviewLine: attended ? (formatFieldLine(r.reviewPages, r.reviewNote, r.reviewPassed) || '—') : '—',
                            rating: attended ? (r.rating || '—') : '—'
                        };
                    })
                    .filter(Boolean)
                    .sort((a, b) => a.date.localeCompare(b.date));
            }, [selectedReportStudentId, sessions, reportMode, reportMonth, reportFrom, reportTo]);

            const copyStudentReport = (row) => {

                let report = `━━━━━━━━━━━━━━\n`;

                report += `🕌 ${settings.halakaName}\n`;
                report += `📅 من ${from} إلى ${to}\n`;
                report += `━━━━━━━━━━━━━━\n`;
                report += `إجمالي الأيام: ${row.totalDays} | حضور: ${row.presentCount} | تأخر: ${row.lateCount}\n`;
                report += `غياب بعذر: ${row.excusedCount} | غياب بدون عذر: ${row.absentCount}\n`;
                report += `📌 مجموع الحفظ: ${row.hifzTotal} صفحة\n`;
                report += `📌 مجموع المراجعة: ${row.reviewTotal} صفحة\n`;
                report += `━━━━━━━━━━━━━━\n`;
                studentDayLog.forEach(entry => {
                    report += `${entry.date} — ${statusLabel(entry.status)}\n`;
                    if (entry.status === 'present' || entry.status === 'late') {
                        report += `حفظ: ${entry.hifzLine} | مراجعة: ${entry.reviewLine} | تقييم: ${entry.rating}\n`;
                    }
                    report += `──────────────\n`;
                });
                report += `━━━━━━━━━━━━━━`;

                const textArea = document.createElement("textarea");
                textArea.value = report;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert("تم نسخ الكشف بنجاح!");
            };

            // رأس رسمي موحّد لكل من تقرير الحلقة وكشف الطالب
            const ReportLetterhead = ({ title, subtitle }) => (
                <div className="avoid-break text-center pb-4 mb-4">

            // صندوق إحصائية بحجم أكبر مخصص لقوالب التصدير العريضة (وليس لبطاقة الجوال الصغيرة)
            const ExportStatBox = ({ label, value, color, icon }) => (

            const ExportFrame = ({ children }) => (

            const handleRedeemStars = (e) => {

            // دالة تصدير البيانات (النسخ الاحتياطي)

            // دالة استيراد البيانات (الاستعادة)

                            </button>
                        </div>
                        <div className="p-3 space-y-1 flex-1 overflow-y-auto">
                            <button 
                                onClick={() => { setActiveTab('settings'); setSelectedStudentId(null); setShowDrawer(false); }}
                                className={`w-full flex items-center gap-3 p-3 rounded-2xl text-sm font-bold transition-colors ${activeTab === 'settings' ? 'bg-emerald-50 text-emerald-700' : 'text-gray-700 hover:bg-gray-50'}`}
                            >
                                <Icon name="settings" size={18} className="text-gray-400" /> الإعدادات
                            </button>
                            <button 
                                onClick={() => { setActiveTab('about'); setShowDrawer(false); }}
                                className={`w-full flex items-center gap-3 p-3 rounded-2xl text-sm font-bold transition-colors ${activeTab === 'about' ? 'bg-emerald-50 text-emerald-700' : 'text-gray-700 hover:bg-gray-50'}`}
                            >
                                <Icon name="info" size={18} className="text-gray-400" /> حول التطبيق
                            </button>
                        </div>
                        <div className="p-4 text-center text-[9px] text-gray-300 font-bold border-t border-gray-100 leading-relaxed">
                            تطوير: سيف الدين مكية<br />جميع الحقوق محفوظة © {new Date().getFullYear()}
                        </div>
                    </div>

                    {/* نافذة تأكيد إعادة الضبط - تأكيد مشدّد لأن الإجراء نهائي ولا يمكن التراجع عنه */}
                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-4 no-print">
                            <div className="bg-white rounded-3xl p-6 max-w-sm w-full space-y-4 shadow-2xl">
                                <div className="flex flex-col items-center text-center gap-2">
                                    <div className="bg-red-100 text-red-600 p-3 rounded-full">
                                        <Icon name="alert-triangle" size={28} />
                                    </div>
                                    <h3 className="font-black text-red-700 text-lg">تأكيد إعادة الضبط</h3>
                                    <p className="text-xs text-gray-500 leading-relaxed">
                                        سيتم حذف <span className="font-black text-red-600">كل التسجيلات اليومية</span> ({sessions.length} يوم مسجّل حالياً) بشكل نهائي، ولا يمكن التراجع عن هذا الإجراء أبداً.
                                        <br /><br />
                                        <span className="font-bold text-gray-600">لن يتم حذف:</span> أسماء الطلاب، أرصدة النقاط والنجوم، أو إعدادات الحلقة.
                                    </p>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold text-gray-400 block px-1">للتأكيد، اكتب كلمة "حذف" في الحقل بالأسفل:</label>
                                    <input 
                                        value={resetConfirmText}
                                        onChange={(e) => setResetConfirmText(e.target.value)}
                                        className="w-full bg-gray-50 border-2 border-red-100 rounded-2xl p-3 text-center font-black text-red-700 focus:ring-1 focus:ring-red-400"
                                        placeholder="حذف"
                                        dir="rtl"
                                    />
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => {setShowResetModal(false); setResetConfirmText('');}} 
                                        className="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-2xl"
                                    >
                                        إلغاء
                                    </button>
                                    <button 
                                        disabled={resetConfirmText.trim() !== 'حذف'}
                                        onClick={performFullReset}
                                        className={`flex-1 font-black py-3 rounded-2xl text-white transition-all ${resetConfirmText.trim() === 'حذف' ? 'bg-red-600 shadow-lg shadow-red-200' : 'bg-red-200 cursor-not-allowed'}`}
                                    >
                                        حذف نهائياً
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* نافذة تصفح سجل الأيام السابقة */}
                    {showSessionHistory && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center p-4 no-print" onClick={() => setShowSessionHistory(false)}>
                            <div className="bg-white rounded-3xl p-5 max-w-sm w-full max-h-[75vh] flex flex-col shadow-2xl" onClick={(e) => e.stopPropagation()}>
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-black text-gray-800 flex items-center gap-2">
                                        <Icon name="calendar" size={18} className="text-emerald-600" /> سجل الأيام السابقة
                                    </h3>
                                    <button onClick={() => setShowSessionHistory(false)} className="text-gray-400 p-1">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>
                                <div className="overflow-y-auto space-y-2 flex-1">
                                    {sessionDatesSorted.length === 0 && (
                                        <p className="text-center text-xs text-gray-400 py-8">لا توجد أي أيام مسجلة بعد</p>
                                    )}
                                    {sessionDatesSorted.map(date => {
                                        const sess = sessions.find(s => s.date === date);
                                        const presentCount = sess.records.filter(r => r.status === 'present').length;
                                        const lateCount = sess.records.filter(r => r.status === 'late').length;
                                        const absentCount = sess.records.filter(r => r.status === 'absent' || r.status === 'absent_excused').length;
                                        return (
                                            <div 
                                                key={date}
                                                className={`w-full flex justify-between items-center p-3 rounded-2xl border transition-colors ${date === selectedSessionDate ? 'bg-emerald-50 border-emerald-200' : 'bg-gray-50 border-transparent'}`}
                                            >
                                                <button 
                                                    onClick={() => { setSelectedSessionDate(date); setShowSessionHistory(false); }}
                                                    className="flex-1 text-right"
                                                >
                                                    <span className="text-xs font-black text-gray-700 block">{formatDisplayDateShort(date)}{date === todayKey ? ' (اليوم)' : ''}</span>
                                                    <span className="text-[10px] font-bold text-gray-400 flex items-center gap-2 mt-0.5 flex-wrap">
                                                        <span className="text-emerald-600">✔ حاضر {presentCount}</span>
                                                        <span className="text-amber-600">🕒 تأخر {lateCount}</span>
                                                        <span className="text-red-500">✖ غائب {absentCount}</span>
                                                    </span>
                                                </button>
                                                <button 
                                                    onClick={() => confirmDeleteDay(date)}
                                                    title="حذف تسجيلات هذا اليوم"
                                                    className="text-gray-300 hover:text-red-500 p-2 transition-colors"
                                                >
                                                    <Icon name="trash-2" size={15} />
                                                </button>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/80 backdrop-blur-lg border-t border-gray-100 p-2 flex justify-around items-center no-print z-50 rounded-t-[30px] shadow-2xl">
                        <button onClick={() => {setActiveTab('dashboard'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'dashboard' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="home" size={20} />
                            <span className="text-[10px] font-black mt-1">الرئيسية</span>
                        </button>
                        <button onClick={() => {setActiveTab('session'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'session' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="edit-3" size={20} />
                            <span className="text-[10px] font-black mt-1">الجلسة</span>
                        </button>
                        <button onClick={() => {setActiveTab('students'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'students' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="users" size={20} />
                            <span className="text-[10px] font-black mt-1">الطلاب</span>
                        </button>
                        <button onClick={() => {setActiveTab('reports'); setSelectedStudentId(null);}} className={`flex flex-col items-center p-2 rounded-2xl transition-all ${activeTab === 'reports' || activeTab === 'student_profile' ? 'text-emerald-700 bg-emerald-50' : 'text-gray-400'}`}>
                            <Icon name="bar-chart-3" size={20} />
                            <span className="text-[10px] font-black mt-1">التقارير</span>
                        </button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // تسجيل الـ Service Worker: يخزّن الصفحة والمكتبات بعد أول فتح ناجح بالإنترنت،
        // حتى يستمر التطبيق بالعمل لاحقاً بدون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
